# Application Config
spring.application.name=mp-trip-planner
server.port=8080

# Database Configuration (H2 in-memory mode for zero-setup execution with MySQL dialect compatibility)
spring.datasource.url=jdbc:h2:mem:mptourismdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# For MySQL Database (uncomment and replace credentials to use real MySQL):
# spring.datasource.url=jdbc:mysql://localhost:3306/mp_tourism_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# For MySQL Dialect:
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# File Upload Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT & AI Keys
jwt.secret=${JWT_SECRET:MPTourismSecretKeyForJWTAuthTokenGeneration2026SecureKey!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# LLM API Config Placeholder (OpenAI/Anthropic/Gemini or Custom REST endpoint)
ai.llm.api-key=${AI_API_KEY:DEMO_MP_TOURISM_AI_KEY}
ai.llm.api-url=${AI_API_URL:https://api.openai.com/v1/chat/completions}
